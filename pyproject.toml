[project]
name = "car-sales-assistant"
version = "0.1.0"
description = "A smart car sales chatbot powered by Claude 3.5 Sonnet"
authors = [
    {name = "Car Sales Assistant", email = "ososanyatayo@gmail.com"}
]
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "anthropic>=0.7.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-community>=0.0.20",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "torch>=2.0.0",
]
requires-python = ">=3.9"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
