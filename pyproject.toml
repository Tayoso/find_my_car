[project]
name = "find_my_car"
version = "0.1.0"
description = "Vehicle Recommendation Chatbot using LangChain RAG"
authors = [
    {name = "Vehicle Chatbot Team"}
]
dependencies = [
    "langchain==0.1.0",
    "langchain-community==0.0.10",
    "langchain-openai==0.0.5",
    "pandas==2.1.4",
    "streamlit==1.29.0",
    "python-dotenv==1.0.0",
    "openai>=1.10.0,<2.0.0",
    "faiss-cpu==1.7.4",
    "sentence-transformers==2.2.2",
    "langchain-core>=0.1.23",
]
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []
